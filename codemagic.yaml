# Codemagic build configuration for Quadsu (iOS).
#
# Prerequisites, all done once in the Codemagic UI / Apple portals:
#   1. App Store Connect API key added to Codemagic under
#      Teams > Integrations > Developer Portal, named exactly
#      `codemagic_app_store_key` (see `integrations` below).
#   2. Bundle ID `com.quadsuapp.ios` registered at developer.apple.com, with
#      an Apple Distribution certificate and an App Store provisioning profile
#      for it under Code signing identities. The API key needs Admin access
#      to generate the certificate.
#   3. App record created in App Store Connect for that bundle ID.
#
# `flutter analyze` is deliberately not run here: the project reports ~700
# style lints, and `flutter analyze` exits non-zero on any issue, which would
# fail every build. There are zero actual errors.

workflows:
  ios-release:
    name: iOS Release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.quadsuapp.ios

    integrations:
      app_store_connect: codemagic_app_store_key

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing on the Xcode project
        # Applies the provisioning profiles Codemagic fetched, and writes
        # /Users/builder/export_options.plist used by the build step below.
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # Uploads the IPA to App Store Connect and makes it available to internal
    # TestFlight testers. It does not submit the build for App Store review.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
