name: quadsu_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.8+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  light_compressor: ^2.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.2
  flutter_easyloading: ^3.0.5
  intl: ^0.19.0
  flutter_timezone: ^3.0.1     
  http: ^1.2.0
  pinput: ^4.0.0
  permission_handler: ^11.3.0
  internet_connection_checker: ^1.0.0+1
  package_info_plus: ^8.0.0
  # --- UI Widgets ---
  wolt_modal_sheet: ^0.9.2
  flutter_rating_bar: ^4.0.1
  flutter_spinkit: ^5.2.0
  provider: ^6.1.1
  dropdown_search: ^5.0.6
  country_picker: ^2.0.22
  pinch_zoom: ^2.0.0
  custom_info_window: ^1.0.1
  smooth_page_indicator: ^1.1.0
  flutter_html: ^3.0.0-alpha.6
  another_xlider: ^3.0.2
  dropdown_textfield: ^1.2.0
  table_calendar: ^3.0.9

  # --- Media & Files ---
  image_picker: ^1.1.2
  image_cropper: ^8.0.1
  file_picker: ^8.0.7
  cached_network_image: ^3.3.1
  video_thumbnail: ^0.5.3
  video_player: ^2.9.1
  chewie: ^1.8.5

  # --- Firebase & Auth ---
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging:
  flutter_local_notifications: ^17.2.2
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  googleapis_auth: ^1.6.0
  
  flutter_svg: ^2.0.10+1

  # --- Misc ---
  url_launcher: ^6.2.5
  flutter_paypal: ^0.2.1
  agora_rtc_engine:
  share_plus: ^10.0.2
  wakelock_plus: ^1.2.8
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ✅ NO OVERRIDES: This allows Flutter to get the correct, working versions.

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/images/logo.png
    - assets/images/launch.png
    - assets/images/logou.png
    - assets/images/sarah.png
    - assets/images/emily.png
    - assets/images/marcus.png
    - assets/images/sarah_chen.png
    - assets/images/alex.png
    - assets/icons/home.png
    - assets/icons/profile.png
    - assets/icons/star_outline.png
    - assets/icons/trending.png
    - assets/icons/heart.png
    - assets/icons/chat.png
    - assets/icons/calendar.png

  fonts:
    - family: Poppins-Regular
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf